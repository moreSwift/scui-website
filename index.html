<!DOCTYPE html>
<html>
    <head>
        <title>SwiftCrossUI</title>
        <link rel="stylesheet" href="index.css" />

        <nav class="row">
            <section>
                <a href="/" id="home-tab">SwiftCrossUI</a>
            </section>
            <section>
                <a href="http://stackotter.github.io/swift-cross-ui/documentation/swiftcrossui/">Docs</a>
                <a href="https://github.com/stackotter/swift-cross-ui">GitHub</a>
                <a href="https://discord.gg/fw2trT48ny">Community</a>
            </section>
        </nav>
    </head>
    <body>
        <section id="main">
            <h1 class="headline">SwiftCrossUI</h1>
            <div class="subheadline">Native UI without the fuss.</div>

            <img src="images/music-player/appkit.webp" class="desktop-preview" id="hero-image" />

            <div class="row" id="floating-controls">
                <div class="control">
                    <div class="label">Backend</div>
                    <div class="picker" id="backend-picker">
                        <div class="option selected">AppKit</div>
                        <div class="option">Gtk 4</div>
                        <div class="option">WinUI 3</div>
                    </div>
                </div>
                <div class="control">
                    <div class="label">Color scheme</div>
                    <div class="picker" id="color-scheme-picker">
                        <div class="option selected">Dark</div>
                        <div class="option">Light</div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
